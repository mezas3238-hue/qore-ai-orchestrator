name: PR58 ready transition

on:
  push:
    branches:
      - agent/qore-deterministic-cost-control-058

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    if: ${{ github.repository == 'mezas3238-hue/qore-ai-orchestrator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark exact PR 58 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: PR_kwDOUIe4X88AAAABBjDW8g
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/qore-deterministic-cost-control-058"
          RESULT="$(gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
            -f id="$PR_NODE_ID")"
          test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.number' <<<"$RESULT")" = "58"
          test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.isDraft' <<<"$RESULT")" = "false"
          echo "PR #58 is ready for review."

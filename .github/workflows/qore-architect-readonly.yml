name: QORE Architect autonomous cycle

on:
  workflow_dispatch:
    inputs:
      confirm_api_spend:
        description: Allow bounded Sol architect API calls for this cycle
        required: true
        type: boolean
        default: false
      enable_codex_plan:
        description: If Sol routes to CODEX, allow one Codex PLAN-ONLY call
        required: true
        type: boolean
        default: false
      external_dispatch_mode:
        description: Behavior when Sol routes to existing Claude/DeepSeek reviewer repos
        required: true
        type: choice
        options:
          - off
          - dry_run
          - execute
        default: dry_run
      sol_reasoning_effort:
        description: Adaptive Sol reasoning policy or explicit override
        required: true
        type: choice
        options:
          - auto
          - medium
          - high
          - xhigh
          - max
        default: auto

permissions:
  contents: read

concurrency:
  group: qore-architect-autonomous-cycle
  cancel-in-progress: false

jobs:
  no-spend:
    if: ${{ inputs.confirm_api_spend != true }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No model request made. Re-run with confirm_api_spend=true."

  architect-cycle:
    if: ${{ inputs.confirm_api_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout orchestrator infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify required OpenAI credentials without exposing values
        env:
          OPENAI_SOL_API_KEY: ${{ secrets.OPENAI_SOL_API_KEY }}
          OPENAI_CODEX_API_KEY: ${{ secrets.OPENAI_CODEX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_SOL_API_KEY"
          if [[ "${{ inputs.enable_codex_plan }}" == "true" ]]; then
            test -n "$OPENAI_CODEX_API_KEY"
          fi
          echo "Required OpenAI credentials are configured."

      - name: Enforce trusted ref for external execute mode
        if: ${{ inputs.external_dispatch_mode == 'execute' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          echo "External reviewer execute mode is bound to orchestrator main."

      - name: Checkout live qore-core read-only
        run: |
          set -euo pipefail
          git clone --depth 50 https://github.com/mezas3238-hue/qore-core.git workspace/qore-core
          git -C workspace/qore-core checkout --detach origin/main
          echo "QORE main: $(git -C workspace/qore-core rev-parse HEAD)"

      - name: Build canonical QORE state snapshot
        run: |
          set -euo pipefail
          python3 scripts/collect_qore_state.py \
            --repo-dir workspace/qore-core \
            --output artifacts/qore-state.json

      - name: Collect Claude and DeepSeek work and control-plane state
        env:
          QORE_REVIEWER_DISPATCH_TOKEN: ${{ secrets.QORE_REVIEWER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/collect_external_reviewer_state.py \
            --output artifacts/external-reviewer-state-base.json
          python3 scripts/augment_reviewer_control_plane.py \
            --state artifacts/external-reviewer-state-base.json \
            --output artifacts/external-reviewer-state.json
          python3 scripts/merge_external_reviewer_state.py \
            --snapshot artifacts/qore-state.json \
            --reviewers artifacts/external-reviewer-state.json

      - name: Validate snapshot and reviewer visibility before any model spend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("artifacts/qore-state.json").read_text())
          if state.get("snapshot_consistent") is not True:
              raise SystemExit("QORE main changed or could not be bound during snapshot")
          if state.get("collection_errors"):
              raise SystemExit(f"QORE snapshot is incomplete: {state['collection_errors']}")
          if not state.get("roadmap_documents"):
              raise SystemExit("No canonical roadmap documents found")
          if not state.get("constitution_documents"):
              raise SystemExit("No QORE Constitution documents found")
          protection = state.get("branch_protection") or {}
          if protection.get("protected") is not True:
              raise SystemExit("qore-core main is not observed as protected")
          if "quality" not in protection.get("required_status_contexts", []):
              raise SystemExit("required qore-core quality context was not observed")
          external = state.get("external_reviewer_state") or {}
          if external.get("configured") is True and external.get("errors"):
              raise SystemExit(
                  "External reviewer/control-plane state is incomplete before spend: "
                  + repr(external["errors"])
              )
          if "${{ inputs.external_dispatch_mode }}" == "execute" and external.get("configured") is not True:
              raise SystemExit("execute mode requires QORE_REVIEWER_DISPATCH_TOKEN")
          print("Snapshot, reviewer control plane, and protection binding verified before spend.")
          PY

      - name: Build bounded model-facing context
        run: |
          set -euo pipefail
          python3 scripts/build_model_context.py \
            --snapshot artifacts/qore-state.json \
            --output artifacts/qore-model-context-base.json
          python3 scripts/augment_engineer_context.py \
            --context artifacts/qore-model-context-base.json \
            --output artifacts/qore-model-context.json

      - name: Select adaptive Sol reasoning effort
        id: reasoning
        run: |
          set -euo pipefail
          python3 scripts/select_sol_reasoning_v2.py \
            --snapshot artifacts/qore-state.json \
            --mode '${{ inputs.sol_reasoning_effort }}' \
            --output artifacts/sol-reasoning-policy.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Run GPT-5.6 Sol Principal Architect initial pass
        env:
          OPENAI_SOL_API_KEY: ${{ secrets.OPENAI_SOL_API_KEY }}
          SOL_REASONING_EFFORT: ${{ steps.reasoning.outputs.effort }}
          SOL_MAX_OUTPUT_TOKENS: ${{ steps.reasoning.outputs.max_output_tokens }}
        run: |
          set -euo pipefail
          python3 scripts/run_sol_architect_v2.py \
            --snapshot artifacts/qore-model-context.json \
            --charter charters/SOL-PRINCIPAL-ARCHITECT.md \
            --schema schemas/architect_decision.schema.json \
            --output artifacts/architect-decision-initial.json \
            --usage-output artifacts/sol-usage-initial.json

      - name: Evaluate one bounded reasoning escalation
        id: escalation
        run: |
          set -euo pipefail
          python3 scripts/evaluate_sol_escalation.py \
            --decision artifacts/architect-decision-initial.json \
            --current '${{ steps.reasoning.outputs.effort }}' \
            --output artifacts/sol-escalation.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Promote initial Sol decision when no escalation is required
        if: ${{ steps.escalation.outputs.escalate != 'true' }}
        run: |
          set -euo pipefail
          cp artifacts/architect-decision-initial.json artifacts/architect-decision.json
          cp artifacts/sol-usage-initial.json artifacts/sol-usage.json

      - name: Run one escalated Sol verification pass
        if: ${{ steps.escalation.outputs.escalate == 'true' }}
        env:
          OPENAI_SOL_API_KEY: ${{ secrets.OPENAI_SOL_API_KEY }}
          SOL_REASONING_EFFORT: ${{ steps.escalation.outputs.target_effort }}
          SOL_MAX_OUTPUT_TOKENS: ${{ steps.escalation.outputs.max_output_tokens }}
        run: |
          set -euo pipefail
          python3 scripts/run_sol_architect_v2.py \
            --snapshot artifacts/qore-model-context.json \
            --charter charters/SOL-PRINCIPAL-ARCHITECT.md \
            --schema schemas/architect_decision.schema.json \
            --output artifacts/architect-decision.json \
            --usage-output artifacts/sol-usage.json

      - name: Validate preliminary autonomous decision
        id: preliminary
        run: |
          set -euo pipefail
          python3 scripts/validate_architect_continuation.py \
            --decision artifacts/architect-decision.json \
            --snapshot artifacts/qore-state.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Reconstruct and continue one non-terminal Sol step
        if: ${{ steps.preliminary.outputs.status == 'RECONSTRUCTION_REQUIRED' }}
        env:
          OPENAI_SOL_API_KEY: ${{ secrets.OPENAI_SOL_API_KEY }}
          QORE_REVIEWER_DISPATCH_TOKEN: ${{ secrets.QORE_REVIEWER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          cp artifacts/architect-decision.json artifacts/architect-decision-before-reconstruction.json

          python3 scripts/collect_qore_state.py \
            --repo-dir workspace/qore-core \
            --output artifacts/qore-state.json
          python3 scripts/collect_external_reviewer_state.py \
            --output artifacts/external-reviewer-state-base.json
          python3 scripts/augment_reviewer_control_plane.py \
            --state artifacts/external-reviewer-state-base.json \
            --output artifacts/external-reviewer-state.json
          python3 scripts/merge_external_reviewer_state.py \
            --snapshot artifacts/qore-state.json \
            --reviewers artifacts/external-reviewer-state.json
          python3 scripts/build_model_context.py \
            --snapshot artifacts/qore-state.json \
            --output artifacts/qore-model-context-base.json
          python3 scripts/augment_engineer_context.py \
            --context artifacts/qore-model-context-base.json \
            --output artifacts/qore-model-context-refresh.json
          python3 scripts/prepare_sol_continuation_context.py \
            --context artifacts/qore-model-context-refresh.json \
            --decision artifacts/architect-decision-before-reconstruction.json \
            --output artifacts/qore-model-context.json

          EFFORT=$(python3 -c 'import json; print(json.load(open("artifacts/architect-decision-before-reconstruction.json"))["reasoning_assessment"]["effort_used"])')
          case "$EFFORT" in
            medium) LIMIT=5000 ;;
            high) LIMIT=7000 ;;
            xhigh) LIMIT=9000 ;;
            max) LIMIT=12000 ;;
            *) echo "invalid continuation effort" >&2; exit 2 ;;
          esac

          SOL_REASONING_EFFORT="$EFFORT" SOL_MAX_OUTPUT_TOKENS="$LIMIT" \
            python3 scripts/run_sol_architect_v2.py \
              --snapshot artifacts/qore-model-context.json \
              --charter charters/SOL-PRINCIPAL-ARCHITECT.md \
              --schema schemas/architect_decision.schema.json \
              --output artifacts/architect-decision-continuation-initial.json \
              --usage-output artifacts/sol-usage-continuation-initial.json

          python3 scripts/evaluate_sol_escalation.py \
            --decision artifacts/architect-decision-continuation-initial.json \
            --current "$EFFORT" \
            --output artifacts/sol-continuation-escalation.json

          ESCALATE=$(python3 -c 'import json; print("true" if json.load(open("artifacts/sol-continuation-escalation.json"))["escalate"] else "false")')
          if [[ "$ESCALATE" == "true" ]]; then
            TARGET=$(python3 -c 'import json; print(json.load(open("artifacts/sol-continuation-escalation.json"))["target_effort"])')
            TARGET_LIMIT=$(python3 -c 'import json; print(json.load(open("artifacts/sol-continuation-escalation.json"))["max_output_tokens"])')
            SOL_REASONING_EFFORT="$TARGET" SOL_MAX_OUTPUT_TOKENS="$TARGET_LIMIT" \
              python3 scripts/run_sol_architect_v2.py \
                --snapshot artifacts/qore-model-context.json \
                --charter charters/SOL-PRINCIPAL-ARCHITECT.md \
                --schema schemas/architect_decision.schema.json \
                --output artifacts/architect-decision.json \
                --usage-output artifacts/sol-usage.json
          else
            cp artifacts/architect-decision-continuation-initial.json artifacts/architect-decision.json
            cp artifacts/sol-usage-continuation-initial.json artifacts/sol-usage.json
          fi

      - name: Validate final autonomous decision
        id: routing
        run: |
          set -euo pipefail
          python3 scripts/validate_architect_continuation.py \
            --decision artifacts/architect-decision.json \
            --snapshot artifacts/qore-state.json \
            --github-output "$GITHUB_OUTPUT"
          echo "Sol final status: $(python3 -c 'import json; print(json.load(open("artifacts/architect-decision.json"))["status"])')"

      - name: Enforce reconstruction loop guard
        if: ${{ steps.routing.outputs.status == 'RECONSTRUCTION_REQUIRED' }}
        run: |
          set -euo pipefail
          echo "Sol still requires reconstruction after the bounded refresh. This is a controller safety stop, not architectural completion." >&2
          exit 17

      - name: Run Codex Principal Engineer plan
        if: ${{ inputs.enable_codex_plan == true && steps.routing.outputs.status == 'ENGINEERING_TASK' && steps.routing.outputs.actor == 'CODEX' && steps.routing.outputs.engineering_enabled == 'true' }}
        env:
          OPENAI_CODEX_API_KEY: ${{ secrets.OPENAI_CODEX_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/run_codex_engineer_plan_v2.py \
            --snapshot artifacts/qore-model-context.json \
            --decision artifacts/architect-decision.json \
            --charter charters/CODEX-PRINCIPAL-ENGINEER.md \
            --schema schemas/codex_plan.schema.json \
            --output artifacts/codex-plan.json \
            --usage-output artifacts/codex-usage.json

      - name: Build exact Claude or DeepSeek reviewer package
        if: ${{ inputs.external_dispatch_mode != 'off' && steps.routing.outputs.status == 'REVIEW_TASK' && (steps.routing.outputs.actor == 'CLAUDE_CODE' || steps.routing.outputs.actor == 'DEEPSEEK') && steps.routing.outputs.review_enabled == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/build_reviewer_package.py \
            --decision artifacts/architect-decision.json \
            --snapshot artifacts/qore-state.json \
            --orchestrator-run-id '${{ github.run_id }}' \
            --prompt-output artifacts/reviewer-prompt.md \
            --request-output artifacts/reviewer-request.json \
            --metadata-output artifacts/reviewer-package.json

      - name: Dispatch to existing reviewer repository
        if: ${{ inputs.external_dispatch_mode == 'execute' && github.ref == 'refs/heads/main' && steps.routing.outputs.status == 'REVIEW_TASK' && (steps.routing.outputs.actor == 'CLAUDE_CODE' || steps.routing.outputs.actor == 'DEEPSEEK') && steps.routing.outputs.review_enabled == 'true' }}
        env:
          QORE_REVIEWER_DISPATCH_TOKEN: ${{ secrets.QORE_REVIEWER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$QORE_REVIEWER_DISPATCH_TOKEN"
          python3 scripts/dispatch_reviewer_request.py \
            --prompt artifacts/reviewer-prompt.md \
            --request artifacts/reviewer-request.json \
            --metadata artifacts/reviewer-package.json \
            --result-output artifacts/reviewer-dispatch.json

      - name: Publish bounded run summary
        if: ${{ always() }}
        run: |
          {
            echo "# QORE Architect autonomous cycle"
            echo
            if [[ -f artifacts/qore-model-context.json ]]; then
              echo "## Model context metrics"
              echo '```json'
              python3 -c 'import json; c=json.load(open("artifacts/qore-model-context.json")); print(json.dumps(c.get("metrics", {}), indent=2, sort_keys=True))'
              echo '```'
            fi
            if [[ -f artifacts/external-reviewer-state.json ]]; then
              echo "## External reviewer/control-plane state"
              echo '```json'
              cat artifacts/external-reviewer-state.json
              echo '```'
            fi
            if [[ -f artifacts/sol-reasoning-policy.json ]]; then
              echo "## Adaptive reasoning policy"
              echo '```json'
              cat artifacts/sol-reasoning-policy.json
              echo '```'
            fi
            if [[ -f artifacts/sol-escalation.json ]]; then
              echo "## Escalation gate"
              echo '```json'
              cat artifacts/sol-escalation.json
              echo '```'
            fi
            if [[ -f artifacts/architect-decision.json ]]; then
              echo "## Final Sol decision"
              echo '```json'
              cat artifacts/architect-decision.json
              echo '```'
            fi
            if [[ -f artifacts/codex-plan.json ]]; then
              echo "## Codex plan"
              echo '```json'
              cat artifacts/codex-plan.json
              echo '```'
            fi
            if [[ -f artifacts/reviewer-package.json ]]; then
              echo "## External reviewer package"
              echo '```json'
              cat artifacts/reviewer-package.json
              echo '```'
              echo "External dispatch mode: ${{ inputs.external_dispatch_mode }}"
            fi
            if [[ -f artifacts/reviewer-dispatch.json ]]; then
              echo "## Reviewer dispatch"
              echo '```json'
              cat artifacts/reviewer-dispatch.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable cycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qore-architect-cycle-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

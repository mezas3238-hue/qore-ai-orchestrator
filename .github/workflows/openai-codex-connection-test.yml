name: OpenAI Codex connection test

on:
  workflow_dispatch:
    inputs:
      confirm_api_spend:
        description: Explicitly allow one minimal OpenAI API request
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openai-codex-connection-test
  cancel-in-progress: false

jobs:
  no-spend:
    if: ${{ inputs.confirm_api_spend != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse API call until explicitly confirmed
        run: |
          echo "No API request executed. Re-run manually with confirm_api_spend=true to perform the bounded connection test."

  connection-test:
    if: ${{ inputs.confirm_api_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout orchestrator infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify secret is configured without exposing it
        env:
          OPENAI_CODEX_API_KEY: ${{ secrets.OPENAI_CODEX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_CODEX_API_KEY"
          echo "OPENAI_CODEX_API_KEY is configured."

      - name: Run one bounded Codex API request
        env:
          OPENAI_CODEX_API_KEY: ${{ secrets.OPENAI_CODEX_API_KEY }}
          OPENAI_CODEX_MODEL: gpt-5.3-codex
        run: |
          set -euo pipefail
          python3 scripts/openai_codex_connection_test.py

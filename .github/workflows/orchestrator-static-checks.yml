name: Orchestrator static checks

on:
  pull_request:
    paths:
      - "charters/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - "charters/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout orchestrator infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Compile Python runners
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/openai_sol_connection_test.py \
            scripts/openai_codex_connection_test.py \
            scripts/collect_qore_state.py \
            scripts/collect_external_reviewer_state.py \
            scripts/augment_reviewer_control_plane.py \
            scripts/merge_external_reviewer_state.py \
            scripts/collect_codex_worker_state.py \
            scripts/build_model_context.py \
            scripts/augment_engineer_context.py \
            scripts/augment_codex_worker_context.py \
            scripts/prepare_sol_continuation_context.py \
            scripts/validate_architect_continuation.py \
            scripts/select_sol_reasoning.py \
            scripts/select_sol_reasoning_v2.py \
            scripts/evaluate_sol_escalation.py \
            scripts/run_sol_architect.py \
            scripts/run_sol_architect_v2.py \
            scripts/run_codex_engineer_plan.py \
            scripts/run_codex_engineer_plan_v2.py \
            scripts/preflight_codex_engineer_token.py \
            scripts/build_codex_engineering_request.py \
            scripts/dispatch_codex_worker.py \
            scripts/run_codex_engineer_worker_v2.py \
            scripts/publish_codex_candidate_v2.py \
            scripts/build_reviewer_package.py \
            scripts/dispatch_reviewer_request.py

      - name: Parse strict JSON schemas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("schemas").glob("*.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              if schema.get("type") != "object":
                  raise SystemExit(f"{path}: top-level schema must be object")
              if schema.get("additionalProperties") is not False:
                  raise SystemExit(f"{path}: additionalProperties must be false")
              print(f"schema ok: {path}")
          PY

      - name: Run orchestrator regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Verify permanent role, continuation, cost, and security boundaries
        run: |
          set -euo pipefail
          grep -F "sole source of truth" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "Adaptive reasoning policy" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "Reviewer return state and adjudication" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "WAITING_AGENT" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "NO_ACTION is not an allowed architect status" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F '`max`' charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "You are the Principal Engineer" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "PLAN-ONLY" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "BOUNDED WORKER" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "second Quality Gate" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "No decision from this architect grants Production authority" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "QORE_REVIEWER_DISPATCH_TOKEN" .github/workflows/qore-architect-readonly.yml
          grep -F "prompt_cache_key" scripts/run_sol_architect_v2.py
          grep -F "QORE_CODEX_ENGINEER_TOKEN" .github/workflows/codex-engineer-token-preflight.yml
          grep -F "no resource created" scripts/preflight_codex_engineer_token.py
          grep -F "MAX_TURNS = 16" scripts/run_codex_engineer_worker_v2.py
          grep -F "MAX_TOTAL_TOKENS = 120_000" scripts/run_codex_engineer_worker_v2.py
          grep -F "run_quality_gate" scripts/run_codex_engineer_worker_v2.py
          grep -F -- "--controller-qg" .github/workflows/codex-engineer-worker.yml
          grep -F "publish_codex_candidate_v2.py" .github/workflows/codex-engineer-worker.yml
          grep -F "actions: write" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "collect_codex_worker_state.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "augment_codex_worker_context.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "dispatch_codex_worker.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "codex_worker_mode" .github/workflows/qore-architect-autonomous-v2.yml
          ! grep -F "run_codex_engineer_plan_v2.py" .github/workflows/qore-architect-autonomous-v2.yml
          ! grep -F "QORE_CODEX_ENGINEER_TOKEN" scripts/run_codex_engineer_worker_v2.py
          ! grep -F "QORE_REVIEWER_DISPATCH_TOKEN" scripts/run_codex_engineer_worker_v2.py
          ! grep -F "CLAUDE_CODE_OAUTH_TOKEN" .github/workflows/qore-architect-autonomous-v2.yml
          ! grep -F "DEEPSEEK_API_KEY" .github/workflows/qore-architect-autonomous-v2.yml

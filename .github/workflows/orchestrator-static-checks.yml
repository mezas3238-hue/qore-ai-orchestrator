name: Orchestrator static checks

on:
  pull_request:
    paths:
      - "charters/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "docs/**"
      - "recovery/**"
  push:
    branches:
      - main
    paths:
      - "charters/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "docs/**"
      - "recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout orchestrator infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Compile Python runners
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/openai_sol_connection_test.py \
            scripts/openai_codex_connection_test.py \
            scripts/collect_qore_state.py \
            scripts/collect_external_reviewer_state.py \
            scripts/augment_reviewer_control_plane.py \
            scripts/merge_external_reviewer_state.py \
            scripts/collect_codex_worker_state.py \
            scripts/build_model_context.py \
            scripts/augment_engineer_context.py \
            scripts/augment_codex_worker_context.py \
            scripts/prepare_sol_continuation_context.py \
            scripts/validate_architect_continuation.py \
            scripts/select_sol_reasoning.py \
            scripts/select_sol_reasoning_v2.py \
            scripts/evaluate_sol_escalation.py \
            scripts/run_sol_architect.py \
            scripts/run_sol_architect_v2.py \
            scripts/run_codex_engineer_plan.py \
            scripts/run_codex_engineer_plan_v2.py \
            scripts/preflight_codex_engineer_token.py \
            scripts/build_codex_engineering_request.py \
            scripts/dispatch_codex_worker.py \
            scripts/run_codex_engineer_worker_v2.py \
            scripts/publish_codex_candidate_v2.py \
            scripts/build_reviewer_package.py \
            scripts/build_reviewer_package_frozen_qg.py \
            scripts/build_reviewer_package_public_logs.py \
            scripts/dispatch_reviewer_request.py \
            scripts/dispatch_reviewer_request_recovery.py \
            scripts/prepare_reviewer_recovery.py \
            scripts/trigger_reviewer_recovery.py \
            scripts/trigger_reviewer_recovery_retry.py \
            scripts/resume_after_agent_completion.py \
            scripts/resume_after_agent_completion_v2.py \
            scripts/recover_pre_spend_architect.py \
            scripts/rearm_autonomy.py

      - name: Parse strict JSON schemas and recovery requests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          for path in sorted(Path("schemas").glob("*.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              if schema.get("type") != "object":
                  raise SystemExit(f"{path}: top-level schema must be object")
              if schema.get("additionalProperties") is not False:
                  raise SystemExit(f"{path}: additionalProperties must be false")
              print(f"schema ok: {path}")

          reviewer_allowed = {
              "schema_version",
              "source_architect_run_id",
              "expected_source_head_sha",
              "reason",
          }
          pre_spend_allowed = {
              "schema_version",
              "failed_child_run_id",
              "failed_child_run_attempt",
              "expected_failed_head_sha",
              "source_resume_run_id",
              "reason",
          }
          codex_replay_allowed = {
              "schema_version",
              "source_run_id",
              "source_run_attempt",
              "source_head_sha",
              "package_id",
          }
          for path in sorted(Path("recovery").glob("*.json")):
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"{path}: recovery request must be an object")
              schema = value.get("schema_version")
              if schema == "qore.reviewer.dispatch.recovery.request.v1":
                  if set(value) != reviewer_allowed:
                      raise SystemExit(f"{path}: reviewer recovery request keys are not exact")
                  run_id = value.get("source_architect_run_id")
                  if type(run_id) is not int or run_id <= 0:
                      raise SystemExit(f"{path}: source run ID is invalid")
                  head = value.get("expected_source_head_sha")
                  if not isinstance(head, str) or re.fullmatch(r"[0-9a-f]{40}", head) is None:
                      raise SystemExit(f"{path}: source HEAD is invalid")
                  reason = value.get("reason")
                  if not isinstance(reason, str) or not reason.strip():
                      raise SystemExit(f"{path}: recovery reason is empty")
              elif schema == "qore.architect.pre_spend.recovery.request.v1":
                  if set(value) != pre_spend_allowed:
                      raise SystemExit(f"{path}: pre-spend recovery request keys are not exact")
                  run_id = value.get("failed_child_run_id")
                  attempt = value.get("failed_child_run_attempt")
                  source_resume = value.get("source_resume_run_id")
                  head = value.get("expected_failed_head_sha")
                  if type(run_id) is not int or run_id <= 0:
                      raise SystemExit(f"{path}: failed child run ID is invalid")
                  if type(attempt) is not int or attempt <= 0:
                      raise SystemExit(f"{path}: failed child run attempt is invalid")
                  if type(source_resume) is not int or source_resume <= 0:
                      raise SystemExit(f"{path}: source resume run ID is invalid")
                  if not isinstance(head, str) or re.fullmatch(r"[0-9a-f]{40}", head) is None:
                      raise SystemExit(f"{path}: failed child HEAD is invalid")
                  reason = value.get("reason")
                  if not isinstance(reason, str) or not reason.strip():
                      raise SystemExit(f"{path}: recovery reason is empty")
              elif schema == "qore.codex.completion.replay.v1":
                  if set(value) != codex_replay_allowed:
                      raise SystemExit(f"{path}: Codex completion replay keys are not exact")
                  run_id = value.get("source_run_id")
                  attempt = value.get("source_run_attempt")
                  head = value.get("source_head_sha")
                  package = value.get("package_id")
                  if type(run_id) is not int or run_id <= 0:
                      raise SystemExit(f"{path}: Codex source run ID is invalid")
                  if type(attempt) is not int or attempt <= 0:
                      raise SystemExit(f"{path}: Codex source run attempt is invalid")
                  if not isinstance(head, str) or re.fullmatch(r"[0-9a-f]{40}", head) is None:
                      raise SystemExit(f"{path}: Codex source HEAD is invalid")
                  if not isinstance(package, str) or re.fullmatch(r"QORE-CODEX-[0-9a-f]{12}-[0-9a-f]{16}", package) is None:
                      raise SystemExit(f"{path}: Codex package is invalid")
              else:
                  raise SystemExit(f"{path}: recovery request schema is invalid")
              print(f"recovery request ok: {path}")
          PY

      - name: Run orchestrator regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Verify permanent role, continuation, cost, recovery, and security boundaries
        run: |
          set -euo pipefail
          grep -F "sole source of truth" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "Adaptive reasoning policy" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "Reviewer return state and adjudication" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "WAITING_AGENT" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "NO_ACTION is not an allowed architect status" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F '`max`' charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "You are the Principal Engineer" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "PLAN-ONLY" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "BOUNDED WORKER" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "second Quality Gate" charters/CODEX-PRINCIPAL-ENGINEER.md
          grep -F "No decision from this architect grants Production authority" charters/SOL-PRINCIPAL-ARCHITECT.md
          grep -F "QORE_REVIEWER_DISPATCH_TOKEN" .github/workflows/qore-architect-readonly.yml
          grep -F "prompt_cache_key" scripts/run_sol_architect_v2.py
          grep -F "QORE_CODEX_ENGINEER_TOKEN" .github/workflows/codex-engineer-token-preflight.yml
          grep -F "no resource created" scripts/preflight_codex_engineer_token.py
          grep -F "MAX_TURNS = 16" scripts/run_codex_engineer_worker_v2.py
          grep -F "MAX_TOTAL_TOKENS = 120_000" scripts/run_codex_engineer_worker_v2.py
          grep -F "run_quality_gate" scripts/run_codex_engineer_worker_v2.py
          grep -F -- "--controller-qg" .github/workflows/codex-engineer-worker.yml
          grep -F "publish_codex_candidate_v2.py" .github/workflows/codex-engineer-worker.yml
          grep -F "completion-callback:" .github/workflows/codex-engineer-worker.yml
          grep -F 'qore_agent_completion_v1' .github/workflows/codex-engineer-worker.yml
          grep -F '"actor": "CODEX"' .github/workflows/codex-engineer-worker.yml
          grep -F "parse_codex_repository_event" scripts/resume_after_agent_completion_v2.py
          grep -F "worker job is not exact completed success" scripts/resume_after_agent_completion_v2.py
          grep -F "qore-codex-worker-" scripts/resume_after_agent_completion_v2.py
          grep -F "QORE Codex completion replay" .github/workflows/qore-codex-completion-replay.yml
          grep -F "recovery/codex-completion-current.json" .github/workflows/qore-codex-completion-replay.yml
          grep -F "actions: write" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "collect_codex_worker_state.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "augment_codex_worker_context.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "dispatch_codex_worker.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "codex_worker_mode" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "QORE_CORE_READ_TOKEN:" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "build_reviewer_package_public_logs.py" .github/workflows/qore-architect-autonomous-v2.yml
          grep -F "frozen_qg.main" scripts/build_reviewer_package_public_logs.py
          grep -F "no exact frozen reviewer QG summary matches the live freeze" scripts/build_reviewer_package_frozen_qg.py
          grep -F "live QG run no longer matches exact successful QORE CI" scripts/build_reviewer_package_frozen_qg.py
          grep -F "workflow_run:" .github/workflows/qore-agent-completion-resume.yml
          grep -F "QORE Architect autonomous V2" .github/workflows/qore-agent-completion-resume.yml
          grep -F "repository_dispatch:" .github/workflows/qore-agent-completion-resume.yml
          grep -F "qore_agent_completion_v1" .github/workflows/qore-agent-completion-resume.yml
          grep -F "recovery/architect-pre-spend-current.json" .github/workflows/qore-agent-completion-resume.yml
          grep -F "recover_pre_spend_architect.py" .github/workflows/qore-agent-completion-resume.yml
          grep -F "PRE_SPEND_RECOVERY_ALREADY_DISPATCHED" scripts/recover_pre_spend_architect.py
          grep -F "MAX_PRE_SPEND_RECOVERIES_PER_SESSION = 1" scripts/recover_pre_spend_architect.py
          grep -F "verified_no_model_or_agent_side_effect" scripts/recover_pre_spend_architect.py
          grep -F -- "--max-auto-resumes 3" .github/workflows/qore-agent-completion-resume.yml
          grep -F -- "--max-estimated-spend-usd 5.00" .github/workflows/qore-agent-completion-resume.yml
          grep -F -- "--max-sol-calls 12" .github/workflows/qore-agent-completion-resume.yml
          grep -F -- "--max-codex-jobs 3" .github/workflows/qore-agent-completion-resume.yml
          grep -F "workflow_dispatch:" .github/workflows/qore-autonomy-rearm.yml
          grep -F "confirm_rearm" .github/workflows/qore-autonomy-rearm.yml
          grep -F "REARM_BOUNDED_AUTONOMY" .github/workflows/qore-autonomy-rearm.yml
          grep -F "ALLOWED_STOP_REASONS" scripts/rearm_autonomy.py
          grep -F "this exact stopped receipt has already been rearmed" scripts/rearm_autonomy.py
          grep -F '"gpt-5.6-sol"' scripts/resume_after_agent_completion.py
          grep -F '"gpt-5.3-codex"' scripts/resume_after_agent_completion.py
          grep -F "LOOP_SIGNATURE_REPEATED_PACKAGE" scripts/resume_after_agent_completion.py
          grep -F "qore-reviewer-dispatch-recovery-trigger" .github/workflows/qore-reviewer-recovery-trigger.yml
          grep -F "trigger_reviewer_recovery_retry.py" .github/workflows/qore-reviewer-recovery-trigger.yml
          grep -F "github.event.workflow_run.path == '.github/workflows/qore-architect-autonomous-v2.yml'" .github/workflows/qore-reviewer-recovery-trigger.yml
          grep -F "QORE_CORE_READ_TOKEN:" .github/workflows/qore-architect-review-recovery-v1.yml
          grep -F "build_reviewer_package_public_logs.py" .github/workflows/qore-architect-review-recovery-v1.yml
          grep -F "MAX_RECOVERY_ATTEMPTS = 3" scripts/trigger_reviewer_recovery_retry.py
          grep -F "QORE-DEEPSEEK-REVIEW package=" scripts/dispatch_reviewer_request_recovery.py
          ! grep -F "OPENAI_SOL_API_KEY" .github/workflows/qore-architect-review-recovery-v1.yml
          ! grep -F "run_codex_engineer_plan_v2.py" .github/workflows/qore-architect-autonomous-v2.yml
          ! grep -F "QORE_CODEX_ENGINEER_TOKEN" scripts/run_codex_engineer_worker_v2.py
          ! grep -F "QORE_REVIEWER_DISPATCH_TOKEN" scripts/run_codex_engineer_worker_v2.py
          ! grep -F "CLAUDE_CODE_OAUTH_TOKEN" .github/workflows/qore-architect-autonomous-v2.yml
          ! grep -F "DEEPSEEK_API_KEY" .github/workflows/qore-architect-autonomous-v2.yml
